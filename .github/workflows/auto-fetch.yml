name: Auto Fetch KBL Data

on:
  schedule:
    # ─── GitHub Actions schedule 은 drop 흔함 ─────────────────────────
    # 공식 문서: "GitHub does not guarantee scheduled workflows will trigger."
    # 특히 HH:00 / HH:30 는 전 세계 cron 몰려서 drop 많음. 2가지 방어:
    # 1) HH:00 / HH:30 피해 어중간한 분 사용 (17, 33, 47 등)
    # 2) 중요한 시간대는 20분 간격으로 2-3번 중복 trigger — 하나는 돌 거라 기대.
    #    fetch 캐시가 있어 중복 호출해도 KBL API 부담 없음 + 변경 없으면 commit 도 안 생김.
    # ────────────────────────────────────────────────────────────────

    # 평일 저녁 경기 종료 (~21:30) 직후 — 3번 시도
    - cron: '33 12 * * 1-5'  # 21:33 KST
    - cron: '53 12 * * 1-5'  # 21:53 KST
    - cron: '17 13 * * 1-5'  # 22:17 KST

    # 주말 1차 경기(14:00) 종료 직후 — 2번 시도
    - cron: '33 7 * * 0,6'   # 16:33 KST
    - cron: '53 7 * * 0,6'   # 16:53 KST

    # 주말 2차 경기(16:30) 종료 직후 — 2번 시도
    - cron: '3 10 * * 0,6'   # 19:03 KST
    - cron: '23 10 * * 0,6'  # 19:23 KST

    # 매일 23:07 KST (UTC 14:07) — 모든 경기 확실히 끝난 후 백업
    - cron: '7 14 * * *'
    # 매일 06:07 KST (UTC 21:07) — 새벽 백업 (전날 schedule 지연/실패 대비)
    - cron: '7 21 * * *'
  # GitHub 웹에서 수동 실행도 가능
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch all KBL data
        env:
          # KBL API 가 일부 SSL 체인 이슈가 있어 로컬과 동일하게 무시
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm run fetch:all
        continue-on-error: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & push if data changed
        run: |
          # 파싱된 JSON 만 커밋 (raw HTML 덤프는 제외)
          git add -A data/*.json
          if git diff --staged --quiet; then
            echo "✅ No data changes — skip commit"
          else
            git commit -m "chore(data): auto-update $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M KST')"
            git push
            echo "✅ Pushed updated data — Vercel will redeploy"
          fi
